# azure-pipelines.yml — generated by eai-eng-cicd-pipeline
# service: orchestration-agent
trigger:
  branches:
    include: [ main ]

variables:
  imageName: 'symphony.azurecr.io/orchestration-agent'

stages:
  - stage: BuildAndTest
    jobs:
      - job: build_test
        pool:
          vmImage: 'ubuntu-latest'
        steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.12'
      - script: pip install -r requirements.txt
        displayName: 'Install dependencies'
      - script: pytest -q
        displayName: 'Run tests'

  - stage: Containerize
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: docker_build
        steps:
          - task: Docker@2
            inputs:
              command: 'build'
              repository: 'symphony.azurecr.io/orchestration-agent'
              dockerfile: 'Dockerfile'
              tags: '$(Build.BuildId)'

  - stage: Push
    dependsOn: Containerize
    condition: succeeded()
    jobs:
      - job: docker_push
        steps:
          - task: Docker@2
            inputs:
              command: 'push'
              repository: 'symphony.azurecr.io/orchestration-agent'
              tags: '$(Build.BuildId)'

  - stage: Deploy
    dependsOn: Push
    condition: succeeded()
    jobs:
      - deployment: DeployToAKS
        environment: 'orchestration-agent-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  inputs:
                    action: 'deploy'
                    manifests: 'k8s/deployment.yml'
                    containers: 'symphony.azurecr.io/orchestration-agent:$(Build.BuildId)'
